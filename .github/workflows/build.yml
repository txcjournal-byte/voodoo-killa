name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build plugin + tests
        run: cmake --build build --config Release --parallel --target VoodooKilla_VST3 VoodooKilla_Standalone VoodooKillaTests

      - name: Run tests
        run: build\VoodooKillaTests_artefacts\Release\VoodooKillaTests.exe
        shell: cmd

      - name: Stage files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/VoodooKilla_artefacts/Release/VST3/TrapWin Timer.vst3" dist/
          Copy-Item "build/VoodooKilla_artefacts/Release/Standalone/TrapWin Timer.exe" dist/
          Copy-Item Packaging/README-USER.txt dist/README.txt

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(TrapWinTimer VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist" "/DOutputDir=$PWD\installers" Packaging\windows\TrapWinTimer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: TrapWinTimer-Windows-Installer
          path: installers

      - uses: actions/upload-artifact@v4
        with:
          name: TrapWinTimer-Windows-Plugin
          path: dist

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build plugin + tests
        run: cmake --build build --parallel 4 --target VoodooKilla_VST3 VoodooKilla_AU VoodooKilla_Standalone VoodooKillaTests

      - name: Run tests
        run: build/VoodooKillaTests_artefacts/Release/VoodooKillaTests

      - name: Import signing certificates (optional)
        env:
          MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          if [ -z "$MAC_CERTS_P12" ]; then echo "No certificates - building an unsigned test installer."; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MAC_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$KC" -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build installer (.pkg + .dmg)
        env:
          MAC_APP_IDENTITY: ${{ secrets.MAC_APP_IDENTITY }}
          MAC_INSTALLER_IDENTITY: ${{ secrets.MAC_INSTALLER_IDENTITY }}
          MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
          MAC_APP_PASSWORD: ${{ secrets.MAC_APP_PASSWORD }}
        run: |
          VERSION=$(sed -nE 's/^project\(TrapWinTimer VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          Packaging/mac/build_pkg.sh build/VoodooKilla_artefacts/Release "$VERSION" installers

      - uses: actions/upload-artifact@v4
        with:
          name: TrapWinTimer-macOS-Installer
          path: installers
