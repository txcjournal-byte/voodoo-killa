name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build plugin + tests
        run: cmake --build build --config Release --parallel --target VoodooKilla_VST3 VoodooKilla_Standalone VoodooKillaTests

      - name: Run tests
        run: build\VoodooKillaTests_artefacts\Release\VoodooKillaTests.exe
        shell: cmd

      - name: Stage files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/VoodooKilla_artefacts/Release/VST3/TrapWin Timer.vst3" dist/
          Copy-Item "build/VoodooKilla_artefacts/Release/Standalone/TrapWin Timer.exe" dist/
          Copy-Item Packaging/README-USER.txt dist/README.txt

      - name: Sign plug-in + app (optional, code-signing certificate)
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if (-not $env:WIN_CERT_PFX) { Write-Host "No Windows certificate - unsigned build."; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WIN_CERT_PASSWORD" /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "TrapWin Timer" `
            "dist\TrapWin Timer.vst3\Contents\x86_64-win\TrapWin Timer.vst3" "dist\TrapWin Timer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(TrapWinTimer VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist" "/DOutputDir=$PWD\installers" Packaging\windows\TrapWinTimer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer (optional)
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if (-not $env:WIN_CERT_PFX) { exit 0 }
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WIN_CERT_PASSWORD" /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "TrapWin Timer Setup" (Get-ChildItem installers\*.exe).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: TrapWinTimer-Windows-Installer
          path: installers

      - uses: actions/upload-artifact@v4
        with:
          name: TrapWinTimer-Windows-Plugin
          path: dist

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build plugin + tests
        run: cmake --build build --parallel 4 --target VoodooKilla_VST3 VoodooKilla_AU VoodooKilla_Standalone VoodooKillaTests

      - name: Run tests
        run: build/VoodooKillaTests_artefacts/Release/VoodooKillaTests

      - name: Release builds must be signed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MAC_APP_IDENTITY: ${{ secrets.MAC_APP_IDENTITY }}
          MAC_INSTALLER_IDENTITY: ${{ secrets.MAC_INSTALLER_IDENTITY }}
          MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
        run: |
          if [ -z "$MAC_APP_IDENTITY" ] || [ -z "$MAC_INSTALLER_IDENTITY" ] || [ -z "$MAC_APPLE_ID" ]; then
            echo "::error::Apple signing secrets are missing - see Packaging/DISTRIBUCE.md. A release is never published unsigned."
            exit 1
          fi

      - name: Import signing certificates (optional)
        env:
          MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          if [ -z "$MAC_CERTS_P12" ]; then echo "No certificates - building an unsigned test installer."; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MAC_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$KC" -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build installer (.pkg + .dmg)
        env:
          MAC_APP_IDENTITY: ${{ secrets.MAC_APP_IDENTITY }}
          MAC_INSTALLER_IDENTITY: ${{ secrets.MAC_INSTALLER_IDENTITY }}
          MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
          MAC_APP_PASSWORD: ${{ secrets.MAC_APP_PASSWORD }}
        run: |
          VERSION=$(sed -nE 's/^project\(TrapWinTimer VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          Packaging/mac/build_pkg.sh build/VoodooKilla_artefacts/Release "$VERSION" installers

      - uses: actions/upload-artifact@v4
        with:
          name: TrapWinTimer-macOS-Installer
          path: installers

  # Tag a version (git tag v1.0.0 && git push origin v1.0.0) -> GitHub Release with both installers,
  # ready to download and upload to the shop.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TrapWinTimer-*-Installer
          merge-multiple: true
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "TrapWin Timer ${GITHUB_REF_NAME#v}" \
            --notes "Windows: TrapWin-Timer-*-Windows-Setup.exe - macOS: TrapWin-Timer-*-macOS.dmg" \
            release/*.exe release/*.dmg
